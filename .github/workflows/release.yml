name: release

# 推 tag 时交叉编译各平台并发布 Release 附件。
#
# 触发方式：
#   git tag v1.0.0 && git push origin v1.0.0
#
# ── 产物命名 ──────────────────────────────────────────────────────────
#
# 架构名用 x64 / arm64（opencode 那一套），不用 Go 的 amd64：
#
#   x64   = x86-64，**Intel 和 AMD 的 CPU 都用它**
#          （Go 里的 GOARCH=amd64 指的就是这个）
#   arm64 = ARM64，Apple Silicon（M 系列）/ 高通 Snapdragon X / ARM 服务器
#
# 产物清单：
#
#   agy-Director-windows-x64.exe          Windows x64（带图标）
#   agy-Director-windows-x64.zip          Windows x64（zip 版，给企业分发）
#   agy-Director-windows-arm64.exe        Windows ARM64
#   agy-Director-windows-arm64.zip        Windows ARM64
#   agy-Director-macos-x64.zip            macOS Intel（.app bundle）
#   agy-Director-macos-x64.app.tar.gz     macOS Intel（.app bundle）
#   agy-Director-macos-arm64.zip          macOS Apple Silicon
#   agy-Director-macos-arm64.app.tar.gz   macOS Apple Silicon
#   agy-Director-linux-x64.tar.gz         Linux x64
#   agy-Director-linux-arm64.tar.gz       Linux ARM64
#
# Linux 的二进制是 CGO_ENABLED=0 静态编译的，
# 不需要单独的 musl 版本（opencode 要 musl 是因为它用了 CGO）。
#
# macOS 的 .app bundle 必须在 **macOS runner** 上造
# （iconutil / sips / codesign 都是 macOS 独有的），
# 所以 darwin 走独立的 job，其余平台在 ubuntu 上交叉编译。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: agy-Director

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   goarch: amd64, arch: x64 }
          - { os: linux,   goarch: arm64, arch: arm64 }
          - { os: windows, goarch: amd64, arch: x64 }
          - { os: windows, goarch: arm64, arch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 构建
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          out="${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then out="${out}.exe"; fi
          # 版本号注入：main.version 由 -ldflags 赋值。
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "$out" ./cmd/agy-director
          echo "built: $out"

      - name: 打包（Linux）
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          base="${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}"
          # 解包出来的目录名要好看：用户 tar xzf 之后应该看到
          # "agy-Director-linux-x64/"，而不是 "agy-Director-linux-x64-pkg/"。
          #
          # ⚠️ 不能直接在当前目录 mkdir "$base" ——
          # 二进制本身就叫 "$base"（没有扩展名），同名会报 "File exists"。
          # 所以挪到一个临时工作区里打包，打完再把 tar.gz 搬回来。
          work="$(mktemp -d)"
          pkg="$work/$base"
          mkdir -p "$pkg"
          # ⚠️ 用 cp 而不是 mv —— mv 会把二进制挪走，后面就没得 cp 回来了。
          cp "$base" "$pkg/${{ env.APP_NAME }}"
          cp LICENSE README.md "$pkg/"
          tar -czf "$base.tar.gz" -C "$work" "$base"
          rm -rf "$work"

      - name: 打包（Windows）
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          base="${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}"
          # zip 版给企业分发（有些环境不让直接跑 exe）。
          #
          # ⚠️ 用 cp 而不是 mv —— mv 会把 .exe 挪进 pkg 目录，
          # 后面 rm -rf "$pkg" 就把它删了，.exe 产物直接消失。
          pkg="${base}-pkg"
          mkdir -p "$pkg"
          cp "$base.exe" "$pkg/${{ env.APP_NAME }}.exe"
          cp LICENSE README.md "$pkg/"
          # ubuntu-latest 预装了 zip，但不显式装一次更保险
          # （万一镜像变了就少了产物，而不是整个 job 挂掉）。
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zip
          fi
          (cd "$pkg" && zip -qry "../$base.zip" .)
          rm -rf "$pkg"

      - name: 上传产物（Linux）
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          # ⚠️ 不能用 "$base*" 通配 ——
          # 那会把构建步骤留下的**裸二进制**（没有扩展名那个）
          # 一起捞进来，Release 里就多出一堆没用的重复文件。
          path: ${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: 上传产物（Windows）
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}.exe
            ${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  macos:
    name: build macos-${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin, goarch: amd64, arch: x64 }
          - { os: darwin, goarch: arm64, arch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 构建
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # 产物名用 "macos" 而不是 Go 的 "darwin" —— 用户找的是 macOS。
          # 只有 GOOS 还是 darwin。
          out="${{ env.APP_NAME }}-macos-${{ matrix.arch }}"
          # CGO_ENABLED=0：.app 里的 dylib 搜索路径在
          # "从 Finder 双击"和"从 Terminal 跑"两种启动方式下不一致，
          # 静态编译可以彻底避开这个坑。
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "$out" ./cmd/agy-director
          echo "built: $out"

      - name: 构造 .app bundle
        run: |
          set -euo pipefail
          bash tools/macos-app.sh \
            "${{ env.APP_NAME }}-macos-${{ matrix.arch }}" \
            dist "${{ github.ref_name }}"

      - name: 冒烟测试 bundle 结构
        run: |
          set -euo pipefail
          APP="dist/${{ env.APP_NAME }}.app"
          test -x "$APP/Contents/MacOS/${{ env.APP_NAME }}"
          test -f "$APP/Contents/Resources/${{ env.APP_NAME }}.icns"
          test -f "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          codesign -v "$APP"
          echo "bundle 结构 OK"

      - name: 打包
        run: |
          set -euo pipefail
          base="${{ env.APP_NAME }}-macos-${{ matrix.arch }}"
          cp LICENSE README.md dist/
          # zip 版：解压得到 .app
          (cd dist && zip -qry "../$base.zip" "${{ env.APP_NAME }}.app" LICENSE README.md)
          # .app.tar.gz 版：保留可执行位和符号链接
          tar -czf "$base.app.tar.gz" -C dist "${{ env.APP_NAME }}.app" LICENSE README.md
          rm -rf dist "${{ env.APP_NAME }}-macos-${{ matrix.arch }}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-${{ matrix.arch }}
          path: |
            ${{ env.APP_NAME }}-macos-${{ matrix.arch }}.zip
            ${{ env.APP_NAME }}-macos-${{ matrix.arch }}.app.tar.gz
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [build, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: .github/release-notes.md
          generate_release_notes: true
          draft: false
