name: release

# 推 tag 时交叉编译 6 个平台并发布 Release 附件。
#
# 触发方式：
#   git tag v1.0.0 && git push origin v1.0.0
#
# 产物命名：agy-untun-<os>-<arch>[.exe]

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: 构建
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          out="agy-untun-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then out="${out}.exe"; fi
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/agy-untun
          echo "built: $out"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: agy-untun-${{ matrix.os }}-${{ matrix.arch }}
          path: agy-untun-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
