name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # gofmt 检查。
      #
      # ⚠️ 两个坑：
      #  1. Windows runner 的默认 shell 是 pwsh，POSIX 语法（[ -n "$x" ]）直接 ParserError。
      #  2. `gofmt -l` 无论有没有输出，退出码都是 0 —— 不能靠退出码判断。
      #
      # 所以改成：让 go fmt 就地格式化，再用 git diff 检查工作区是否被改动。
      # git diff --exit-code 在三种 shell 下行为一致。
      - name: gofmt 检查
        run: |
          go fmt ./cmd/... ./internal/...
          git diff --exit-code -- cmd internal

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: go test
        run: go test ./cmd/... ./internal/...
