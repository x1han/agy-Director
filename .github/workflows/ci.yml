name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # 先把依赖拉下来。
      #
      # 现在项目引了 bubbletea / lipgloss / x/term，
      # 下面那步 `go fmt` 需要模块在本地可用。
      # 不显式下载的话，go fmt 会自己去拉 —— 在 CI 上就是白等一轮网络。
      - name: 下载依赖
        run: go mod download

      # gofmt 检查。
      #
      # ⚠️ 两个坑：
      #  1. Windows runner 的默认 shell 是 pwsh，POSIX 语法（[ -n "$x" ]）直接 ParserError。
      #  2. `gofmt -l` 无论有没有输出，退出码都是 0 —— 不能靠退出码判断。
      #
      # 所以改成：让 go fmt 就地格式化，再用 git diff 检查工作区是否被改动。
      # git diff --exit-code 在三种 shell 下行为一致。
      - name: gofmt 检查
        run: |
          go fmt ./cmd/... ./internal/...
          git diff --exit-code -- cmd internal

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: go test
        run: go test ./cmd/... ./internal/...

      # 交叉编译验证：确保每个平台都真的能编出来。
      #
      # 只在 ubuntu 上做 —— 交叉编译 Go 不需要对应平台的机器。
      - name: 交叉编译验证
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="build-check-${os}-${arch}"
            if [ "$os" = "windows" ]; then out="${out}.exe"; fi
            echo "building $target"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -o "$out" ./cmd/agy-director
            rm -f "$out"
          done
